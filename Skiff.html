<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Skiff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap">
<style>
:root{--ink:#0b1626;--sea:#16505c;--lamp:#ffd166;--rock:#ff6b57;--foam:#e9f2f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--ink:#0b1626;--foam:#e9f2f1}}
:root[data-theme="dark"]{--ink:#0b1626}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;touch-action:none;overscroll-behavior:none}
#wrap{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--foam);background:rgba(11,22,38,.72);font-family:Fraunces,Georgia,serif}
#ov.hide{display:none}
h1{margin:0;font-size:56px;font-weight:900;letter-spacing:-.02em;color:var(--lamp)}
p{margin:0;max-width:26ch;font:17px/1.45 system-ui,-apple-system,sans-serif}
button{margin-top:6px;font:700 19px Fraunces,Georgia,serif;padding:14px 34px;border:0;border-radius:999px;background:var(--lamp);color:var(--ink)}
button:focus-visible{outline:3px solid var(--foam);outline-offset:3px}
.ghost{background:transparent;color:var(--foam);border:2px solid var(--foam);padding:10px 28px;font-size:17px;margin-top:0}
#shop{position:absolute;inset:0;overflow:auto;background:rgba(11,22,38,.97);color:var(--foam);padding:24px 18px;font-family:Fraunces,Georgia,serif;display:flex;flex-direction:column;gap:10px}
#shop.hide{display:none}
#shop h2{margin:0;font-size:34px;color:var(--lamp)}
#shop p{max-width:none;margin-bottom:6px}
.card{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:rgba(233,242,241,.07)}
.card canvas{width:72px;height:64px;flex:none}
.card b{flex:1;font-size:19px;text-align:left}
.card small{display:block;margin-top:2px;font:400 13px/1.3 system-ui,-apple-system,sans-serif;opacity:.75}
.card button{margin:0;padding:9px 18px;font-size:15px}
.card button:disabled{opacity:.45}
.card.sel{outline:2px solid var(--lamp)}
#back{align-self:center;margin-top:10px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="ov"><h1 id="t">Skiff</h1><p id="m">Drag to steer. Catch the lanterns, dodge the rocks.</p><button id="b">Start</button><button id="sb" class="ghost">Boats</button></div>
<div id="shop" class="hide"><h2>Boats</h2><p id="bal"></p><div id="list"></div><button id="back" class="ghost">Back</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const T=document.getElementById('t'),M=document.getElementById('m'),B=document.getElementById('b');
let W,H,S,dpr,best=0,wallet=0,owned=[0],cur=0;
try{best=+localStorage.getItem('skiff-best')||0}catch(e){}
try{const s=JSON.parse(localStorage.getItem('skiff-save'));if(s){wallet=s.wallet|0;owned=s.owned||[0];cur=s.cur|0}}catch(e){}
const SEAS=[
{n:'Moonlit Bay',a:'#0b1626',b:'#16505c',rm:1,sp:1},

{n:'Whale Strait',a:'#071226',b:'#1d3f73',rm:1.5,sp:1.3},
{n:'Isle Chain',a:'#12405a',b:'#1f8c8a',rm:1.5,sp:1.3},
{n:'Frozen Sea',a:'#13294a',b:'#5f90b5',rm:1.3,sp:1.2}];
const BOATS=[
{n:'Dinghy',p:0,pk:'Classic. No perk.',h:'#e9f2f1',s:'#ffd166',m:'#ff6b57',k:0,sl:[[0,26,18]]},
{n:'Corsair',p:300,pk:'Start with 4 lives',lv:1,h:'#2a2f45',s:'#ff6b57',m:'#e9f2f1',k:1,sl:[[0,30,-18]]},
{n:'Gull',p:800,pk:'Wider lantern catch',mg:18,h:'#3fa7a0',s:'#ffffff',m:'#0b1626',k:2,sl:[[0,22,20]]},
{n:'Cutter',p:1600,pk:'Slim hull: rocks hit less',hb:10,h:'#b9c4d6',s:'#9b8cff',m:'#ffd166',k:3,sl:[[-2,32,16]]},
{n:'Galleon',p:3500,pk:'+1 life and 50% more points',lv:1,mu:1.5,h:'#c98a2b',s:'#fff1c2',m:'#5a3a12',k:4,sl:[[-9,26,16],[10,19,12]]}];
function drawBoat(c,i,fl){const B=BOATS[i];c.fillStyle=fl?'#fff':B.h;c.beginPath();
if(B.k==1){c.moveTo(-26,4);c.lineTo(26,4);c.lineTo(18,22);c.lineTo(-18,22)}
else if(B.k==2){c.moveTo(-24,4);c.lineTo(24,4);c.lineTo(24,8);c.quadraticCurveTo(0,32,-24,8)}
else if(B.k==3){c.moveTo(-22,6);c.lineTo(28,6);c.lineTo(10,22);c.lineTo(-16,22)}
else if(B.k==4){c.moveTo(-28,2);c.lineTo(28,2);c.lineTo(20,24);c.lineTo(-20,24)}
else{c.moveTo(-24,6);c.lineTo(24,6);c.lineTo(15,22);c.lineTo(-15,22)}
c.closePath();c.fill();
for(const [x,h,w] of B.sl){c.fillStyle=fl?'#fff':B.s;c.beginPath();c.moveTo(x,-h);c.lineTo(x+w,0);c.lineTo(x,0);c.closePath();c.fill();
c.fillStyle=fl?'#fff':B.m;c.fillRect(x-1.5,-h-2,3,h+8)}}
function size(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);S=Math.min(W,H*.62)/380}
addEventListener('resize',size);size();
let g,run=false,last=0,tx=0;

const la=Math.random()*6.283;g.items.push({x:o.x,y:o.y,r:11*S,lamp:1,rot:0,v:0,k:0,vx:Math.cos(la)*150*S,vy:Math.sin(la)*150*S+110*S})}

if(st==1||st==2){ctx.fillStyle='rgba(160,230,255,.6)';ctx.beginPath();ctx.arc(0,34,14+6*Math.sin(b.tm*30),0,7);ctx.fill()}

const BDRAW=[null,drawShark,drawOrca,drawShip,drawWyrm];
function drawShark(b){
const st=b.st,lx=b.lx;
if(st==1){ctx.fillStyle='rgba(255,107,87,'+(.12+.1*Math.sin(b.tm*20))+')';ctx.fillRect(lx-44*S,0,88*S,H)}
let x=g.bx,y=(-90+b.in*210)*S,a=Math.cos(b.a*.7)*.25;
if(st==1){x=lx+Math.sin(b.tm*40)*2*S;y=70*S;a=0}
if(st==2){x=lx;y=b.ly;a=0}
ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(S,S);
ctx.fillStyle=b.hit>0?'#fff':'#4a6275';
ctx.beginPath();ctx.moveTo(0,72);ctx.bezierCurveTo(34,50,42,-10,12,-66);ctx.lineTo(30,-96);ctx.lineTo(0,-80);ctx.lineTo(-30,-96);ctx.lineTo(-12,-66);ctx.bezierCurveTo(-42,-10,-34,50,0,72);ctx.fill();
for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*34,14);ctx.lineTo(s*74,-14);ctx.lineTo(s*30,-18);ctx.fill()}
ctx.fillStyle=b.hit>0?'#fff':'#2f4455';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,-44);ctx.lineTo(-7,-44);ctx.fill();
ctx.fillStyle='#ff3b30';for(const s of[-1,1]){ctx.beginPath();ctx.arc(s*17,46,4.5,0,7);ctx.fill()}
ctx.fillStyle='#0b1626';ctx.beginPath();ctx.ellipse(0,64,17,st==2?15:8,0,0,7);ctx.fill();
ctx.fillStyle='#f4efe6';for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*5-2.5,58);ctx.lineTo(i*5,st==2?74:68);ctx.lineTo(i*5+2.5,58);ctx.fill()}
ctx.restore();
ctx.fillStyle='rgba(233,242,241,.2)';ctx.fillRect(W*.2,58,W*.6,8);ctx.fillStyle='#ff6b57';ctx.fillRect(W*.2,58,W*.6*b.hp/b.max,8)}
function drawKraken(){const b=g.boss,q=g.tent;
if(q){const strike=q.t>1,w=64*S,al=strike?.8:.12+.1*Math.sin(q.t*18);ctx.fillStyle='rgba(255,107,87,'+al+')';ctx.fillRect(q.x-w/2,0,w,H)}
if(!b)return;if(b.type){BDRAW[b.type](b);return}
const y=(-80+b.in*190)*S;ctx.save();ctx.translate(g.bx,y);ctx.scale(S,S);
const gl=ctx.createRadialGradient(0,20,10,0,20,130);gl.addColorStop(0,'rgba(255,60,60,.28)');gl.addColorStop(1,'rgba(255,60,60,0)');ctx.fillStyle=gl;ctx.fillRect(-140,-110,280,280);
const c=b.hit>0?'#fff':'#2b1b4d';ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=13;ctx.lineCap='round';
for(let i=0;i<8;i++){const x0=-62+i*18;ctx.beginPath();ctx.moveTo(x0,10);for(let k=1;k<=6;k++)ctx.lineTo(x0+Math.sin(b.a*3+i+k*.8)*9+(i-3.5)*k*3,10+k*14);ctx.stroke();ctx.fillStyle='rgba(230,210,255,.55)';for(let k=2;k<=6;k+=2){ctx.beginPath();ctx.arc(x0+Math.sin(b.a*3+i+k*.8)*9+(i-3.5)*k*3,10+k*14,3.4,0,7);ctx.fill()}}ctx.fillStyle=c;
ctx.beginPath();ctx.ellipse(0,0,62,48,0,0,7);ctx.fill();
for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*14-7,-40+Math.abs(i)*3);ctx.lineTo(i*14,-62+Math.abs(i)*5);ctx.lineTo(i*14+7,-40+Math.abs(i)*3);ctx.fill()}
for(const x of[-24,24]){ctx.fillStyle='#ff3b30';ctx.beginPath();ctx.ellipse(x,-8,12,9,x<0?.35:-.35,0,7);ctx.fill();ctx.fillStyle='#0b1626';ctx.fillRect(x-1.5,-16,3,17)}
ctx.fillStyle='#0b1626';ctx.beginPath();ctx.ellipse(0,22,30,14,0,0,7);ctx.fill();
ctx.fillStyle='#f4efe6';for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(i*6-3,12);ctx.lineTo(i*6,i%2?22:26);ctx.lineTo(i*6+3,12);ctx.fill()}
ctx.restore();
ctx.fillStyle='rgba(233,242,241,.2)';ctx.fillRect(W*.2,58,W*.6,8);ctx.fillStyle='#ff6b57';ctx.fillRect(W*.2,58,W*.6*b.hp/b.max,8)}
function step(dt){
g.t+=dt;g.wave+=dt*40;g.sp-=dt;g.ct+=dt;
const speed=(190+Math.min(g.t*6,260))*S;
if(!g.boss&&g.t>=g.nb){g.boss={hp:10+g.bn*4,max:10+g.bn*4,in:0,a:0,hit:0,type:g.bn%5,tm:2.5,st:0,n:0};g.tt=2.5;g.msg2='';g.msg=BOSSMSG[g.bn%5];g.mt=2.2}
if(g.sp<=0){spawn();g.sp=g.sea==4&&!g.boss?74*S/speed:(g.boss?.55:Math.max(.28,.8-g.t*.01))*SEAS[g.sea].sp}
g.x+=(tx-g.x)*Math.min(1,dt*14);g.x=Math.max(22*S,Math.min(W-22*S,g.x));
const by=H-90*S;g.inv=Math.max(0,g.inv-dt);g.flash=Math.max(0,g.flash-dt);
for(const o of g.items){o.y+=(o.vy===undefined?speed*o.v:o.vy)*dt;o.rot+=dt;o.x+=(o.vx||0)*dt;
if(o.k==5){if(!o.st&&o.y>o.ey){o.st=1;o.tm=.7}else if(o.st==1){o.tm-=dt;if(o.tm<=0){o.st=2;erupt(o)}}}
if(o.k==1&&o.y>by-190*S){o.dead=1;splitWreck(o)}
if(!o.dead&&Math.hypot(o.x-g.x,o.y-by)<o.r+(o.lamp?16+(BOATS[cur].mg||0):BOATS[cur].hb||16)*S){
if(o.lamp){o.dead=1;g.score+=Math.round(10*(BOATS[cur].mu||1));g.flash=.12;hitBoss()}
else if(!g.inv){o.dead=1;g.lives--;g.inv=1.2;if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
if(g.lives<=0)over()}}}
g.mt=Math.max(0,g.mt-dt);
const b=g.boss;
if(b){b.in=Math.min(1,b.in+dt/1.5);b.hit=Math.max(0,b.hit-dt);if(!b.frz)b.a+=dt;g.bx=W/2+Math.sin(b.a*.7)*W*.28;g.tt-=dt;
if(b.type==0&&b.in>=1&&g.tt<=0&&!g.tent)g.tent={x:Math.max(40*S,Math.min(W-40*S,g.x)),t:0,done:0};
const q=g.tent;
if(q){q.t+=dt;
if(q.t>1&&q.t<1.35&&!q.done&&!g.inv&&Math.abs(g.x-q.x)<46*S){q.done=1;g.lives--;g.inv=1.2;if(g.lives<=0)over()}
if(q.t>=1.35){g.tent=null;g.tt=2.2}}}
if(b&&b.type==1&&b.in>=1){b.tm-=dt;
if(b.st==0&&b.tm<=0){if(b.n++%2==0){b.st=1;b.tm=1.1;b.lx=Math.max(50*S,Math.min(W-50*S,g.x))}
else{const n=6,gap=Math.floor(Math.random()*n);for(let i=0;i<n;i++){const r=(i==gap?11:15)*S;g.items.push({x:(i+.5)*W/n,y:-r*2,r,lamp:i==gap,rot:Math.random()*6,v:1.1})}b.tm=2.4}}
else if(b.st==1&&b.tm<=0){b.st=2;b.ly=-70*S;b.done=0}
else if(b.st==2){b.ly+=dt*(H+180*S)/.65;
if(!g.inv&&!b.done&&Math.abs(g.x-b.lx)<44*S&&Math.abs(b.ly-by)<70*S){b.done=1;g.lives--;g.inv=1.2;if(g.lives<=0)over()}
if(b.ly>H+110*S){b.st=0;b.tm=2}}}
if(b&&b.type==2&&b.in>=1){b.tm-=dt;b.frz=b.st==3;
if(b.st==0&&b.tm<=0){const p=b.n++%4,a0=Math.atan2(by-120*S,g.x-g.bx),sg=g.x<W/2?-1:1,N=[1,2,3,4][p],D=[0,.6,.5,.35][p],ST=[0,.3,.22,0][p],GH=[.26,.25,.24,.22][p];
b.pend=[];b.rings=[];for(let i=0;i<N;i++)b.pend.push({d:i*D,a:a0+(p==0?(Math.random()-.5)*.4:p==3?sg*.25:sg*ST*i),gh:GH});b.st=3;b.pt=0}
else if(b.st==3){b.pt+=dt;
while(b.pend.length&&b.pt>=b.pend[0].d){const s=b.pend.shift();b.rings.push({r:0,cx:g.bx,cy:120*S,a:s.a,gh:s.gh,hit:0})}
for(const q of b.rings){q.r+=dt*330*S;
if(!q.hit&&Math.abs(Math.hypot(g.x-q.cx,by-q.cy)-q.r)<20*S){let df=Math.atan2(by-q.cy,g.x-q.cx)-q.a;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)>q.gh){q.hit=1;hurt()}}}
b.rings=b.rings.filter(q=>q.r<Math.hypot(W,H)+60);
if(!b.pend.length&&!b.rings.length){b.st=0;b.tm=1.6}}}
if(b&&b.type==3&&b.in>=1){b.tm-=dt;
if(b.st==0&&b.tm<=0){if(b.n++%2==0){b.st=1;b.tm=.8;b.vol=3}
else{b.st=3;b.tm=1.3;let x2=Math.random()*(W-100*S)+50*S;if(Math.abs(x2-g.x)<150*S)x2=g.x<W/2?W-60*S:60*S;b.tg=[{x:Math.max(50*S,Math.min(W-50*S,g.x)),y:by-Math.random()*40*S},{x:x2,y:by-Math.random()*40*S}]}}
else if(b.st==1&&b.tm<=0){if(b.vol>0){fire(b);b.vol--;b.tm=.45}else{b.st=0;b.tm=1.6}}
else if(b.st==3&&b.tm<=0){b.st=4;b.tm=.35;b.h=0}
else if(b.st==4){if(!b.h)for(const t of b.tg)if(Math.hypot(g.x-t.x,by-t.y)<66*S){b.h=1;hurt();break}
if(b.tm<=0){b.tg=null;b.st=0;b.tm=1.8}}}
if(b&&b.type==4&&b.in>=1){b.tm-=dt;b.frz=b.st==1||b.st==2;
if(b.st==0&&b.tm<=0){if(b.n++%2==0){b.st=1;b.tm=1.1;b.ba=Math.atan2(by-120*S,g.x-g.bx)}
else{b.st=3;b.tm=1.2;b.gx=Math.max(70*S,Math.min(W-70*S,g.x+(Math.random()-.5)*200*S));b.rowy=by}}
else if(b.st==1&&b.tm<=0){b.st=2;b.tm=.5;b.h=0}
else if(b.st==2){if(!b.h){let df=Math.atan2(by-120*S,g.x-g.bx)-b.ba;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)<.16){b.h=1;hurt()}}if(b.tm<=0){b.st=0;b.tm=1.6}}
else if(b.st==3&&b.tm<=0){b.st=4;b.tm=.45;b.h=0}
else if(b.st==4){if(!b.h&&Math.abs(g.x-b.gx)>60*S){b.h=1;hurt()}if(b.tm<=0){b.st=0;b.tm=1.8}}}
g.items=g.items.filter(o=>!o.dead&&o.y<H+60&&o.y>-200&&o.x>-120&&o.x<W+120)}
function over(){run=false;wallet+=g.score;save();const nb=g.score>best;if(nb){best=g.score;try{localStorage.setItem('skiff-best',best)}catch(e){}}
T.textContent=nb&&g.score>0?'New best':'Wrecked';
M.textContent=g.score+' points banked'+(nb?'':'. Best is '+best+'.');B.textContent='Sail again';ov.classList.remove('hide')}
function draw(){
const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,SEAS[g.sea].a);gr.addColorStop(1,SEAS[g.sea].b);
ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(233,242,241,.09)';ctx.lineWidth=2;
for(let i=0;i<9;i++){const y=((i*H/8+g.wave*S*3)%(H+40))-20;ctx.beginPath();
for(let x=0;x<=W;x+=20){const yy=y+Math.sin(x/38+i)*5;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke()}
drawKraken();for(const o of g.items){ctx.save();ctx.translate(o.x,o.y);
if(o.lamp){const h=ctx.createRadialGradient(0,0,0,0,0,o.r*3);h.addColorStop(0,'rgba(255,209,102,.5)');h.addColorStop(1,'rgba(255,209,102,0)');
ctx.fillStyle=h;ctx.beginPath();ctx.arc(0,0,o.r*3,0,7);ctx.fill();
ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(0,0,o.r,0,7);ctx.fill();
ctx.fillStyle='#0b1626';ctx.fillRect(-2*S,-o.r-5*S,4*S,5*S)}
else if(o.k){drawOb(o)}
else{ctx.rotate(o.rot*.6);ctx.fillStyle='#ff6b57';ctx.beginPath();
for(let i=0;i<7;i++){const a=i/7*6.283,k=o.r*(i%2?.72:1);ctx.lineTo(Math.cos(a)*k,Math.sin(a)*k)}ctx.closePath();ctx.fill()}
ctx.restore()}
const by=H-90*S;
if(!(g.inv>0&&Math.floor(g.inv*14)%2)){ctx.save();ctx.translate(g.x,by);ctx.scale(S,S);
drawBoat(ctx,cur,g.flash>0);ctx.restore()}
ctx.fillStyle='#e9f2f1';ctx.textBaseline='top';
ctx.font='900 '+Math.round(34*Math.max(S,.8))+'px Fraunces,Georgia,serif';ctx.textAlign='left';ctx.fillText(g.score,18,14);
ctx.textAlign='right';ctx.fillStyle='#ff6b57';ctx.font='24px system-ui,sans-serif';
ctx.fillText('♥'.repeat(Math.max(0,g.lives)),W-18,18);
if(g.mt>0){ctx.textAlign='center';ctx.fillStyle='#ffd166';ctx.font='900 28px Fraunces,Georgia,serif';ctx.fillText(g.msg,W/2,H*.38);if(g.msg2){ctx.font='600 20px Fraunces,Georgia,serif';ctx.fillText(g.msg2,W/2,H*.38+38)}}}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)step(dt);if(g)draw();requestAnimationFrame(loop)}
function start(){reset();run=true;ov.classList.add('hide')}
B.addEventListener('click',start);
function mv(e){tx=e.clientX-cv.getBoundingClientRect().left}
cv.addEventListener('pointerdown',mv);cv.addEventListener('pointermove',mv);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')tx-=70*S;if(e.key==='ArrowRight')tx+=70*S});
const shop=document.getElementById('shop'),list=document.getElementById('list'),bal=document.getElementById('bal');
function save(){try{localStorage.setItem('skiff-save',JSON.stringify({wallet,owned,cur}))}catch(e){}}
function render(){bal.textContent=wallet+' points to spend';list.innerHTML='';
BOATS.forEach((b,i)=>{const own=owned.includes(i),d=document.createElement('div');d.className='card'+(i==cur?' sel':'');
const cn=document.createElement('canvas');cn.width=144;cn.height=128;const x=cn.getContext('2d');x.translate(72,74);x.scale(2,2);drawBoat(x,i,0);
const n=document.createElement('b');n.textContent=b.n;const pk=document.createElement('small');pk.textContent=b.pk;n.append(pk);
const bt=document.createElement('button');bt.textContent=i==cur?'Selected':own?'Use':'Buy '+b.p;bt.disabled=i==cur||(!own&&wallet<b.p);
bt.onclick=()=>{if(!own){wallet-=b.p;owned.push(i)}cur=i;save();render()};
d.append(cn,n,bt);list.append(d)})}
document.getElementById('sb').onclick=()=>{render();shop.classList.remove('hide')};
document.getElementById('back').onclick=()=>shop.classList.add('hide');
reset();draw();requestAnimationFrame(loop);
</script>
