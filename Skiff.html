<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Skiff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap">
<style>
:root{--ink:#0b1626;--sea:#16505c;--lamp:#ffd166;--rock:#ff6b57;--foam:#e9f2f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--ink:#0b1626;--foam:#e9f2f1}}
:root[data-theme="dark"]{--ink:#0b1626}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;touch-action:none;overscroll-behavior:none}
#wrap{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--foam);background:rgba(11,22,38,.72);font-family:Fraunces,Georgia,serif}
#ov.hide{display:none}
h1{margin:0;font-size:56px;font-weight:900;letter-spacing:-.02em;color:var(--lamp)}
#by{margin:-10px 0 4px;font:900 22px Fraunces,Georgia,serif;color:var(--lamp);letter-spacing:.01em;transform:rotate(-4deg);text-shadow:2px 2px 0 rgba(11,22,38,.85);animation:splash 1.6s ease-in-out infinite}
@keyframes splash{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(-4deg) scale(1.07)}}
@media (prefers-reduced-motion:reduce){#by{animation:none}}
p{margin:0;max-width:26ch;font:17px/1.45 system-ui,-apple-system,sans-serif}
button{margin-top:6px;font:700 19px Fraunces,Georgia,serif;padding:14px 34px;border:0;border-radius:999px;background:var(--lamp);color:var(--ink)}
button:focus-visible{outline:3px solid var(--foam);outline-offset:3px}
.ghost{background:transparent;color:var(--foam);border:2px solid var(--foam);padding:10px 28px;font-size:17px;margin-top:0}
#shop{position:absolute;inset:0;overflow:auto;background:rgba(11,22,38,.97);color:var(--foam);padding:24px 18px;font-family:Fraunces,Georgia,serif;display:flex;flex-direction:column;gap:10px}
#shop.hide{display:none}
#shop h2{margin:0;font-size:34px;color:var(--lamp)}
#shop p{max-width:none;margin-bottom:6px}
.card{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:rgba(233,242,241,.07)}
.card canvas{width:72px;height:64px;flex:none}
.card b{flex:1;font-size:19px;text-align:left}
.card small{display:block;margin-top:2px;font:400 13px/1.3 system-ui,-apple-system,sans-serif;opacity:.75}
.card button{margin:0;padding:9px 18px;font-size:15px}
.card button:disabled{opacity:.45}
.card.sel{outline:2px solid var(--lamp)}
#back{align-self:center;margin-top:10px}
#mu{position:absolute;right:12px;bottom:12px;z-index:5;width:40px;height:40px;margin:0;padding:0;border:0;border-radius:50%;background:rgba(233,242,241,.14);color:var(--foam);font:20px system-ui,sans-serif}
#mu.off{opacity:.45;text-decoration:line-through}
#shop{z-index:6}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<button id="mu" aria-label="Toggle music">♪</button>
<div id="ov"><h1 id="t">Skiff</h1><div id="by">By Jon</div><p id="m">Drag to steer. Catch the lanterns, dodge the rocks.</p><button id="b">Start</button><button id="sb" class="ghost">Boats</button></div>
<div id="shop" class="hide"><h2>Boats</h2><p id="bal"></p><div id="list"></div><button id="back" class="ghost">Back</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const T=document.getElementById('t'),M=document.getElementById('m'),B=document.getElementById('b'),BY=document.getElementById('by');
let W,H,S,dpr,best=0,wallet=0,owned=[0],cur=0;
try{best=+localStorage.getItem('skiff-best')||0}catch(e){}
try{const n=localStorage.getItem('skiff-save2'),s=JSON.parse(n||localStorage.getItem('skiff-save'));if(s){wallet=n?s.wallet|0:0;owned=s.owned||[0];cur=s.cur|0}}catch(e){}
const SEAS=[
{n:'Moonlit Bay',a:'#0b1626',b:'#16505c',rm:1,sp:1},
{n:'Wreck Sea',a:'#07140f',b:'#1f3a31',rm:1.5,sp:1.25},
{n:'Whale Strait',a:'#071226',b:'#1d3f73',rm:1.5,sp:1.3},
{n:'Isle Chain',a:'#12405a',b:'#1f8c8a',rm:1.5,sp:1.3},
{n:'Frozen Sea',a:'#13294a',b:'#5f90b5',rm:1.3,sp:1.2}];
const BOATS=[
{n:'Dinghy',p:0,pk:'Classic. No perk.',h:'#e9f2f1',s:'#ffd166',m:'#ff6b57',k:0,sl:[[0,26,18]]},
{n:'Corsair',p:150,pk:'Start with 4 lives',lv:1,h:'#2a2f45',s:'#ff6b57',m:'#e9f2f1',k:1,sl:[[0,30,-18]]},
{n:'Gull',p:400,pk:'Wider lantern catch',mg:18,h:'#3fa7a0',s:'#ffffff',m:'#0b1626',k:2,sl:[[0,22,20]]},
{n:'Cutter',p:800,pk:'Slim hull: rocks hit less',hb:10,h:'#b9c4d6',s:'#9b8cff',m:'#ffd166',k:3,sl:[[-2,32,16]]},
{n:'Galleon',p:1500,pk:'+1 life and 50% more points',lv:1,mu:1.5,h:'#c98a2b',s:'#fff1c2',m:'#5a3a12',k:4,sl:[[-9,26,16],[10,19,12]]},
{n:'Ferry of the Damned',p:0,secret:1,pk:'+2 lives and double points',lv:2,mu:2,h:'#1d3533',s:'#aef5da',m:'#e9f2f1',k:5,sl:[[-6,36,20]]}];
function drawBoat(c,i,fl){const B=BOATS[i];c.fillStyle=fl?'#fff':B.h;c.beginPath();
if(B.k==1){c.moveTo(-26,4);c.lineTo(26,4);c.lineTo(18,22);c.lineTo(-18,22)}
else if(B.k==2){c.moveTo(-24,4);c.lineTo(24,4);c.lineTo(24,8);c.quadraticCurveTo(0,32,-24,8)}
else if(B.k==3){c.moveTo(-22,6);c.lineTo(28,6);c.lineTo(10,22);c.lineTo(-16,22)}
else if(B.k==4){c.moveTo(-28,2);c.lineTo(28,2);c.lineTo(20,24);c.lineTo(-20,24)}
else if(B.k==5){c.moveTo(-32,6);c.lineTo(32,0);c.lineTo(24,24);c.lineTo(-24,24)}
else{c.moveTo(-24,6);c.lineTo(24,6);c.lineTo(15,22);c.lineTo(-15,22)}
c.closePath();c.fill();
for(const [x,h,w] of B.sl){c.fillStyle=fl?'#fff':B.s;c.beginPath();c.moveTo(x,-h);c.lineTo(x+w,0);c.lineTo(x,0);c.closePath();c.fill();
c.fillStyle=fl?'#fff':B.m;c.fillRect(x-1.5,-h-2,3,h+8)}
if(B.k==5&&!fl){c.fillStyle='#2a3a38';c.fillRect(30,-4,2,10);c.fillStyle='#7dffc4';c.beginPath();c.arc(31,-6,3.5,0,7);c.fill()}}
function size(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);S=Math.min(W,H*.62)/380}
addEventListener('resize',size);size();
let g,run=false,last=0,tx=0,ty=0;
function clampY(v){return Math.max(H*.38,Math.min(H-36*S,v))}
function reset(){const y0=H-90*S;g={x:W/2,y:y0,score:0,lives:3+(BOATS[cur].lv||0),items:[],t:0,sp:0,inv:0,flash:0,wave:0,boss:null,nb:40,bn:0,tt:2,tent:null,bx:W/2,mt:0,msg:'',sea:0,msg2:'',msg3:'',sh:0,ct:0};tx=W/2;ty=y0}

for(let i=0;i<n;i++){const a=off+i/n*6.283;g.items.push({x:o.x,y:o.y,r:9*S,lamp:0,rot:0,v:0,k:6,vx:Math.cos(a)*190*S,vy:Math.sin(a)*190*S+110*S})}
const la=Math.random()*6.283;g.items.push({x:o.x,y:o.y,r:11*S,lamp:1,rot:0,v:0,k:0,vx:Math.cos(la)*150*S,vy:Math.sin(la)*150*S+110*S})}

if(Math.random()<.14)g.items.push({x:c,y:-30*S,r:11*S,lamp:1,rot:0,v:1,k:0,vx:0})}

ctx.strokeStyle='#5a3f22';ctx.lineWidth=2*S;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*r*.45,-r*.3);ctx.lineTo(i*r*.35,r*.45);ctx.stroke()}

ctx.fillStyle='#f0ecd8';ctx.beginPath();ctx.moveTo(r*.1,-r*1.25);ctx.lineTo(r*.85,-r*.9);ctx.lineTo(r*.5,-r*.75);ctx.lineTo(r*.1,-r*.5);ctx.fill()}
else if(k==2){ctx.scale((o.vx||1)>0?1:-1,1);

ctx.fillStyle='#cfd9e6';ctx.beginPath();ctx.ellipse(r*.1,r*.25,r*.85,r*.35,0,0,3.14);ctx.fill();
ctx.fillStyle='#5d7391';ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(-r*1.5,-r*.5);ctx.lineTo(-r*1.35,0);ctx.lineTo(-r*1.5,r*.5);ctx.fill();
ctx.fillStyle='#0b1626';ctx.beginPath();ctx.arc(r*.6,-r*.1,r*.07,0,7);ctx.fill();
ctx.strokeStyle='rgba(233,242,241,.6)';ctx.lineWidth=3*S;ctx.beginPath();ctx.moveTo(r*.2,-r*.7);ctx.lineTo(r*.2,-r*1.1);ctx.stroke()}
else if(k==3){ctx.fillStyle='#e8cf8f';ctx.beginPath();ctx.ellipse(0,0,r*1.1,r*.8,0,0,7);ctx.fill();
ctx.fillStyle='#3f8f4a';ctx.beginPath();ctx.ellipse(0,-r*.1,r*.75,r*.5,0,0,7);ctx.fill();
ctx.strokeStyle='#6b4a2a';ctx.lineWidth=3*S;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r*.1,-r*.7);ctx.stroke();
ctx.fillStyle='#2f7a3a';for(let i=0;i<4;i++){const a=i*1.57+.8;ctx.beginPath();ctx.ellipse(r*.1+Math.cos(a)*r*.3,-r*.7+Math.sin(a)*r*.15,r*.28,r*.07,a,0,7);ctx.fill()}}
else if(k==5){if(o.st==1)ctx.translate(Math.sin(o.tm*60)*2*S,0);
ctx.fillStyle='#e8cf8f';ctx.beginPath();ctx.ellipse(0,r*.35,r*1.15,r*.55,0,0,7);ctx.fill();
ctx.fillStyle='#5a4240';ctx.beginPath();ctx.moveTo(-r*.95,r*.35);ctx.lineTo(-r*.3,-r*.7);ctx.lineTo(r*.3,-r*.7);ctx.lineTo(r*.95,r*.35);ctx.closePath();ctx.fill();
ctx.strokeStyle='#ff6b2b';ctx.lineWidth=2.5*S;ctx.beginPath();ctx.moveTo(-r*.15,-r*.6);ctx.lineTo(-r*.3,r*.1);ctx.moveTo(r*.12,-r*.6);ctx.lineTo(r*.25,r*.2);ctx.stroke();
ctx.fillStyle=o.st==1?'#fff1a8':'#ff6b2b';ctx.beginPath();ctx.ellipse(0,-r*.7,r*.32,r*.12,0,0,7);ctx.fill();
if(o.st==1){ctx.fillStyle='rgba(255,120,40,'+(.22+.18*Math.sin(o.tm*30))+')';ctx.beginPath();ctx.arc(0,-r*.5,r*1.6,0,7);ctx.fill()}
else{ctx.fillStyle='rgba(190,190,190,.4)';ctx.beginPath();ctx.arc(r*.1,-r*1.0,r*.22,0,7);ctx.fill();ctx.beginPath();ctx.arc(-r*.05,-r*1.35,r*.16,0,7);ctx.fill()}}
else if(k==7||k==8){const R=r/.62;ctx.rotate(Math.sin(o.rot*.8)*.12*(k==7?-1:1));ctx.translate(k==7?.55*R:-.55*R,0);
ctx.fillStyle='#a37a4c';ctx.beginPath();
if(k==7){ctx.moveTo(-R*1.1,-R*.2);ctx.lineTo(0,-R*.33);ctx.lineTo(R*.12,-R*.15);ctx.lineTo(-R*.05,0);ctx.lineTo(R*.12,R*.2);ctx.lineTo(-R*.04,R*.35);ctx.lineTo(0,R*.5);ctx.lineTo(-R*.7,R*.5)}
else{ctx.moveTo(0,-R*.33);ctx.lineTo(R*1.1,-R*.45);ctx.lineTo(R*.7,R*.5);ctx.lineTo(0,R*.5);ctx.lineTo(R*.04,R*.35);ctx.lineTo(-R*.12,R*.2);ctx.lineTo(R*.05,0);ctx.lineTo(-R*.12,-R*.15)}
ctx.closePath();ctx.fill();ctx.strokeStyle='#f2e2bd';ctx.lineWidth=2.5*S;ctx.stroke();
ctx.strokeStyle='#5a3f22';for(let i=1;i<=2;i++){const x=(k==7?-1:1)*R*.3*i;ctx.beginPath();ctx.moveTo(x,-R*.28);ctx.lineTo(x*.9,R*.45);ctx.stroke()}
if(k==8){ctx.fillStyle='#d9b98a';ctx.fillRect(R*.28,-R*1.3,R*.2,R*1.05);ctx.fillStyle='#f0ecd8';ctx.beginPath();ctx.moveTo(R*.48,-R*1.25);ctx.lineTo(R*1.0,-R*.9);ctx.lineTo(R*.7,-R*.75);ctx.lineTo(R*.48,-R*.5);ctx.fill()}
else{ctx.fillStyle='#d9b98a';ctx.fillRect(-R*.5,-R*.7,R*.2,R*.5)}}
else if(k==10){ctx.fillStyle='#262a33';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='rgba(233,242,241,.5)';ctx.beginPath();ctx.arc(-r*.3,-r*.3,r*.3,0,7);ctx.fill()}
else if(k==6){ctx.fillStyle='#ff6b2b';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(0,0,r*.5,0,7);ctx.fill()}
else{ctx.fillStyle='#dff3fa';ctx.beginPath();ctx.moveTo(-r,r*.5);ctx.lineTo(-r*.5,-r*.4);ctx.lineTo(-r*.1,-r);ctx.lineTo(r*.4,-r*.3);ctx.lineTo(r,r*.5);ctx.closePath();ctx.fill();
ctx.fillStyle='#9ccfe3';ctx.beginPath();ctx.moveTo(-r*.1,-r);ctx.lineTo(r*.4,-r*.3);ctx.lineTo(r,r*.5);ctx.lineTo(0,r*.5);ctx.closePath();ctx.fill()}}
function win(){if(!run)return;run=false;setTrack(5);const nb=g.score>best;if(nb){best=g.score;try{localStorage.setItem('skiff-best',best)}catch(e){}}
const first=!owned.includes(5);if(first)owned.push(5);save();
g.won=1;g.cf=Array.from({length:50},()=>({x:Math.random()*W,y:-Math.random()*H,v:80+Math.random()*120,c:['#ffd166','#ff6b57','#e9f2f1','#7dffc4'][Math.floor(Math.random()*4)],s:5+Math.random()*6,r:Math.random()*6}));
T.textContent='Congratulations, you won!';T.style.fontSize='38px';
M.textContent=g.score+' points, +'+g.sh+' shillings. '+(first?'You unlocked a secret ship: the Ferry of the Damned. Find it in Boats.':'The Ferry of the Damned is already yours.');
B.textContent='Sail again';BY.style.display='none';ov.classList.remove('hide')}
function hitBoss(){const b=g.boss;if(!b||b.in<1)return;b.hp--;b.hit=.2;
if(b.hp<=0){const w=50*(g.bn+1);wallet+=w;g.sh=(g.sh||0)+w;g.score+=100*(g.bn+1);save();g.boss=null;g.bn++;g.sea=g.bn%SEAS.length;g.ct=0;if(g.bn<5)setTrack(g.sea);g.nb=g.t+50;g.tent=null;g.msg=BNAME[b.type]+' defeated!';g.mt=3.2;g.msg2='+'+w+' shillings';g.msg3='Now sailing: '+SEAS[g.sea].n;for(const q of g.items)if(!q.lamp)q.dead=1;if(g.bn>=5)win()}}
const BNAME=['Kraken','Megalodon','Killer whale','Pirate ship','Frost wyrm'];
const BOSSMSG=['A kraken rises!','The megalodon circles!','A killer whale breaches!','Pirates ahoy!','The frost wyrm wakes!'];
function hurt(){if(g.inv)return;g.lives--;g.inv=1.2;if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}if(g.lives<=0)over()}
function bar(b){ctx.fillStyle='rgba(233,242,241,.2)';ctx.fillRect(W*.2,58,W*.6,8);ctx.fillStyle='#ff6b57';ctx.fillRect(W*.2,58,W*.6*b.hp/b.max,8)}
function fire(b){const sx=g.bx,sy=130*S,ty=g.y,a=Math.atan2(ty-sy,g.x-sx);
for(let i=-2;i<=2;i++){const q=a+i*.2;g.items.push({x:sx,y:sy,r:8*S,lamp:0,rot:0,v:0,k:10,vx:Math.cos(q)*340*S,vy:Math.sin(q)*340*S})}}

ctx.beginPath();ctx.moveTo(0,72);ctx.bezierCurveTo(34,50,42,-10,12,-66);ctx.lineTo(30,-96);ctx.lineTo(0,-80);ctx.lineTo(-30,-96);ctx.lineTo(-12,-66);ctx.bezierCurveTo(-42,-10,-34,50,0,72);ctx.fill();
for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*40,6,18,7,s*.6,0,7);ctx.fill()}
ctx.fillStyle=b.hit>0?'#fff':'#3b475e';ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(5,-52);ctx.lineTo(-6,-26);ctx.closePath();ctx.fill();
ctx.fillStyle='#f4f7fa';for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*15,46,8,3.5,s*.5,0,7);ctx.fill()}
ctx.beginPath();ctx.ellipse(0,-30,8,16,0,0,7);ctx.fill();
ctx.restore()}
bar(b)}
function drawShip(b){const st=b.st;

o.connect(gn);out.connect(MU.tg);o.start(t);o.stop(t+dur+att+.1)}
function glide(t){const x=MU.ctx,o=x.createOscillator(),gn=x.createGain(),f1=mf(53+Math.floor(Math.random()*8)),f2=f1*(Math.random()<.5?1.34:.75);
o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+3.5);
gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(.12,t+1.2);gn.gain.linearRampToValueAtTime(.0001,t+3.6);
o.connect(gn);gn.connect(MU.tg);o.start(t);o.stop(t+3.8)}
function sched(t,k,st){const c=TRK[k];if(!c)return;const bl=MU.bl,boss=bl>.25,d=60/(c.bpm*(1+.22*bl))/2,ch=c.ch[Math.floor(st/16)%c.ch.length];
if(st%16==0){for(const m of ch)tone(t,mf(m),c.pad,c.vp*(1+.25*bl),16*d,.5,1,Math.round(c.lp*(1+.9*bl)));
if(c.shim)for(const m of ch.slice(1))tone(t,mf(m+24),'sine',c.vp*.4,16*d,.5,1,3000);
if(c.drone)tone(t,mf(ch[0]-12),'sine',.18,16*d,.5,1,300)}
const mn=c.sc[Math.floor(Math.random()*c.sc.length)];
if(Math.random()<c.p*(1+1.6*bl)*(st%2?.45:1)){tone(t+Math.random()*.03,mf(mn),c.mel,c.vm,c.dec,.01,0);
if(boss&&Math.random()<.55){tone(t+d*.5,mf(mn+7),c.mel,c.vm*.55,Math.min(c.dec,1.2),.01,0);tone(t+d*.5,mf(c.sc[st%c.sc.length]),c.mel,c.vm*.4,.8,.01,0)}}
if(boss){tone(t,mf(ch[0]-12),'square',.05+.05*bl,d*.9,.005,0);
if(st%2==0)tone(t,mf(ch[0]),'sine',.13+.07*bl,.55,.01,0);
if(st%4==2)tone(t,mf(ch[0]+7),'sine',.1*bl,.4,.01,0);
tone(t+d*.5,mf(96+((st*7)%12)),'sine',.028*bl,.07,.005,0)}
if(c.glide&&st%8==0&&Math.random()<.18*c.glide)glide(t);
if(c.bass&&st%4==0)tone(t,mf(ch[0]),'sine',.12,.5,.01,0)}
function tick(){const x=MU.ctx;if(!x||!MU.on||x.state!=='running'||!MU.tg||MU.tr<0||!TRK[MU.tr])return;
const tgt=g&&g.boss&&run?1:0;MU.bl+=(tgt-MU.bl)*.06;if(Math.abs(tgt-MU.bl)<.02)MU.bl=tgt;
const c=TRK[MU.tr],d=60/(c.bpm*(1+.22*MU.bl))/2;
while(MU.next<x.currentTime+.3){sched(MU.next,MU.tr,MU.step);MU.next+=d;MU.step++}}
function setTrack(k){MU.want=k;if(!MU.ctx||MU.tr===k)return;const x=MU.ctx,now=x.currentTime;
if(MU.tg){MU.tg.gain.cancelScheduledValues(now);MU.tg.gain.setTargetAtTime(.0001,now,.5);const old=MU.tg;setTimeout(()=>{try{old.disconnect()}catch(e){}},4000)}
MU.tr=k;MU.step=0;MU.next=now+.15;MU.bl=0;
if(k<0){MU.tg=null;return}
const tg=x.createGain();tg.gain.value=.0001;tg.gain.setTargetAtTime(1,now,.8);tg.connect(MU.mg);const ws=x.createGain();ws.gain.value=.32;tg.connect(ws);ws.connect(MU.dl);
MU.tg=tg}
function initAudio(){if(!MU.ctx){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const x=new A();MU.ctx=x;MU.mg=x.createGain();MU.mg.gain.value=MU.on?.9:0;MU.mg.connect(x.destination);
const dl=x.createDelay(1.5),fb=x.createGain(),fl=x.createBiquadFilter();dl.delayTime.value=.42;fb.gain.value=.38;fl.type='lowpass';fl.frequency.value=1800;dl.connect(fl);fl.connect(fb);fb.connect(dl);fl.connect(MU.mg);MU.dl=dl;
setInterval(tick,50);setTrack(MU.want)}catch(e){MU.ctx=null;return}}
if(MU.ctx.state==='suspended'&&MU.on)MU.ctx.resume()}
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,initAudio,{passive:true}));
const mu=document.getElementById('mu');
function muShow(){mu.classList.toggle('off',!MU.on);mu.setAttribute('aria-pressed',String(MU.on))}
mu.onclick=()=>{MU.on=!MU.on;try{localStorage.setItem('skiff-mute',MU.on?'0':'1')}catch(e){}initAudio();
if(MU.ctx){MU.mg.gain.setTargetAtTime(MU.on?.9:0,MU.ctx.currentTime,.2);if(MU.on)MU.next=MU.ctx.currentTime+.1}muShow()};
muShow();
document.addEventListener('visibilitychange',()=>{if(!MU.ctx)return;if(document.hidden)MU.ctx.suspend();else if(MU.on)MU.ctx.resume()});
reset();draw();requestAnimationFrame(loop);
</script>
